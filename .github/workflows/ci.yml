# CI of this repository. It calls the local copy of the reusable workflow,
# so a pull request here runs the version it changes.
name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/checks.yml

  # Tests of tools/repo-advisories/check.sh against a fake GitHub API. Only
  # here: the script is code of this repository, not of the callers.
  advisory-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the tests
        run: tools/repo-advisories/test.sh

  # Tests of the human-gate job of checks.yml (tools/human-gate/test.sh),
  # against local git repositories and a stub of the GitHub API.
  human-gate-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the tests
        run: tools/human-gate/test.sh
