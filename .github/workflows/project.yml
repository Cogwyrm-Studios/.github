# Adds every pull request of this repository to the organization project.
# Issues are disabled here, so only pull requests trigger it. It calls the
# local copy of the reusable workflow, like ci.yml.
name: project

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  project:
    uses: ./.github/workflows/add-to-project.yml
    with:
      app-id: ${{ vars.AGENTS_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
