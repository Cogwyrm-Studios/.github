# Reusable CI checks shared by every repository of the organization.
#
# On a pull request every job runs and reports, so all repositories produce
# the same check names (see README.md). A job whose check does not apply to
# the repository (no openspec/, no Cargo.toml) passes after a notice instead
# of being skipped.
#
# On a scheduled run (the daily run of the callers) only `deny` and the
# notice of `human-gate` run: advisories change without a commit, the other
# checks do not. `gitleaks`, `openspec` and `rust` are skipped there;
# schedules have no required checks.
name: checks

on:
  workflow_call:
    inputs:
      protected-paths:
        description: >-
          Extra patterns for the human gate, one per line (# starts a comment).
          A pattern without "/" matches the file name in any directory; a
          pattern with "/" matches the whole path. "*" also matches "/".
        type: string
        default: ""
      rust-directory:
        description: Directory that holds the Cargo.toml (crate or workspace root).
        type: string
        default: "."

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  OPENSPEC_VERSION: "1.13.2"
  NODE_VERSION: "22"
  APPROVAL_LABEL: human-approved

jobs:
  gitleaks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # Full history, values redacted. A .gitleaks.toml or .gitleaksignore at
      # the repository root is picked up automatically.
      - name: Scan git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  openspec:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect openspec/
        id: detect
        run: |
          if [ -d openspec ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No openspec/ directory; nothing to validate."
          fi

      # The OpenSpec CLI and all its dependencies are pinned by the lockfile
      # in tools/openspec/ of this repository. Callers use @main, so main is
      # fetched; a pull request here uses its own version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.detect.outputs.present == 'true'
        with:
          repository: Cogwyrm-Studios/.github
          ref: ${{ github.repository == 'Cogwyrm-Studios/.github' && github.event.pull_request.head.sha || 'main' }}
          path: .cogwyrm-ci
          sparse-checkout: tools/openspec
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install OpenSpec
        if: steps.detect.outputs.present == 'true'
        working-directory: .cogwyrm-ci/tools/openspec
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          test "$(node -p 'require("./node_modules/@fission-ai/openspec/package.json").version')" = "$OPENSPEC_VERSION"

      - name: Validate changes and specs
        if: steps.detect.outputs.present == 'true'
        env:
          OPENSPEC_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
          OPENSPEC_NO_UPDATE_CHECK: "1"
        run: .cogwyrm-ci/tools/openspec/node_modules/.bin/openspec validate --all --strict --no-interactive

  human-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Not a pull request
        if: github.event_name != 'pull_request'
        run: echo "::notice::The human gate only applies to pull requests."

      # Trees of the head commit only: a sparse checkout that matches no
      # file fetches with --filter=blob:none and writes nothing to disk, so
      # nothing from the pull request is read or run here. The next step
      # reads file modes from the trees and the few blobs it needs from the
      # API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          sparse-checkout: /.cogwyrm-human-gate-no-files
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A symlink would let an unprotected path stand in for a protected
      # Claude Code file, so none is accepted in Claude Code locations,
      # except a link inside a .claude/hooks/ directory that, followed
      # through the head tree as the file system would (links in the way
      # included), ends at a regular file inside that same directory.
      # Submodules are not accepted there either. The label does not
      # override this. The whole head tree is checked, not only the changed
      # files: a link already in place would let a change to its target
      # bypass the gate.
      - name: Check Claude Code symlinks and submodules
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          # Full paths, lowercase (macOS reads .Claude as .claude).
          patterns=(
            .claude '*/.claude' '.claude/*' '*/.claude/*'
            .claude-plugin '*/.claude-plugin' '.claude-plugin/*' '*/.claude-plugin/*'
            'plugins/*' '*/plugins/*'
            hooks 'hooks/hooks.json' '*/hooks/hooks.json'
            .mcp.json '*/.mcp.json' .lsp.json '*/.lsp.json'
            monitors 'monitors/monitors.json' '*/monitors/monitors.json'
            memory '*/memory' 'memory/rules.md' '*/memory/rules.md'
          )

          work="$RUNNER_TEMP/human-gate-symlinks"
          mkdir -p "$work"
          git ls-tree -r -t -z --full-tree HEAD > "$work/tree" \
            || fail "Could not list the tree of the head commit."

          # Every entry of the head tree (directories included) by lowercase
          # path: "mode sha", or "ambiguous" when two paths differ only in
          # case.
          declare -A entries=()
          link_paths=()
          link_modes=()
          while IFS= read -r -d '' record; do
            meta="${record%%$'\t'*}"
            path="${record#*$'\t'}"
            lpath="${path,,}"
            mode="${meta%% *}"
            if [ -n "${entries[$lpath]+set}" ]; then
              entries[$lpath]=ambiguous
            else
              entries[$lpath]="$mode ${meta##* }"
            fi
            if [ "$mode" = 120000 ] || [ "$mode" = 160000 ]; then
              link_paths+=("$path")
              link_modes+=("$mode")
            fi
          done < "$work/tree"

          # Prints the lowercase target of the link with blob $1. Fails on an
          # empty target or one with a newline or NUL byte.
          link_target() {
            gh api "repos/$REPO/git/blobs/$1" > "$work/blob.json" || return 1
            jq -r '.content' "$work/blob.json" | base64 -d > "$work/target" || return 1
            if [ ! -s "$work/target" ] \
              || [ "$(tr -d '\n\000' < "$work/target" | wc -c)" -ne "$(wc -c < "$work/target")" ]; then
              return 1
            fi
            local target
            target="$(< "$work/target")"
            printf '%s' "${target,,}"
          }

          # Follows the link at the lowercase path $1 through the head tree,
          # as the file system would, and prints where it ends. Fails on an
          # absolute target, a ".." above the root, a missing or ambiguous
          # entry, a submodule, a file used as a directory or more than 40
          # links.
          resolve() {
            local cur="$1" hops=0 entry target part
            local -a dir=() queue=() parts=()
            while :; do
              hops=$((hops + 1))
              if [ "$hops" -gt 40 ]; then return 1; fi
              entry="${entries[$cur]}"
              target="$(link_target "${entry#* }")" || return 1
              if [[ "$target" == /* ]]; then return 1; fi
              dir=()
              if [[ "$cur" == */* ]]; then IFS=/ read -r -a dir <<< "${cur%/*}"; fi
              IFS=/ read -r -a parts <<< "$target"
              queue=("${parts[@]}" "${queue[@]}")
              while [ "${#queue[@]}" -gt 0 ]; do
                part="${queue[0]}"
                queue=("${queue[@]:1}")
                case "$part" in
                  "" | .) continue ;;
                  ..)
                    if [ "${#dir[@]}" -eq 0 ]; then return 1; fi
                    unset 'dir[-1]'
                    continue
                    ;;
                esac
                dir+=("$part")
                cur="$(IFS=/; printf '%s' "${dir[*]}")"
                entry="${entries[$cur]-}"
                case "$entry" in
                  120000\ *) continue 2 ;;
                  040000\ *) ;;
                  100644\ * | 100755\ *)
                    if [ "${#queue[@]}" -gt 0 ]; then return 1; fi
                    ;;
                  *) return 1 ;;
                esac
              done
              if [ "${#dir[@]}" -eq 0 ]; then return 1; fi
              (IFS=/; printf '%s' "${dir[*]}")
              return 0
            done
          }

          violations=()
          for i in "${!link_paths[@]}"; do
            path="${link_paths[$i]}"
            lpath="${path,,}"
            claude=""
            for pattern in "${patterns[@]}"; do
              # shellcheck disable=SC2053 # pattern match on purpose
              if [[ "$lpath" == $pattern ]]; then claude=1; break; fi
            done
            if [ -z "$claude" ]; then continue; fi

            # A submodule brings content from another repository: a bump of
            # its commit would change Claude Code files unseen.
            if [ "${link_modes[$i]}" = 160000 ]; then
              violations+=("$path (submodule in a Claude Code location)")
              continue
            fi
            if [[ "$lpath" != .claude/hooks/* && "$lpath" != */.claude/hooks/* ]]; then
              violations+=("$path (symlink in a Claude Code location)")
              continue
            fi
            # The innermost .claude/hooks directory that holds the link.
            hooks_dir="/$lpath"
            hooks_dir="${hooks_dir%/.claude/hooks/*}/.claude/hooks"
            if [ "${entries[$lpath]}" = ambiguous ] || ! resolved="$(resolve "$lpath")"; then
              violations+=("$path (symlink that does not resolve to a file in the head tree)")
            elif [[ "/$resolved" != "$hooks_dir"/* ]]; then
              violations+=("$path -> $resolved (points outside its .claude/hooks/ directory)")
            elif [[ "${entries[$resolved]}" != 100644\ * && "${entries[$resolved]}" != 100755\ * ]]; then
              violations+=("$path -> $resolved (does not point to a regular file)")
            fi
          done

          if [ "${#violations[@]}" -eq 0 ]; then
            echo "No symlinks or submodules in Claude Code locations, other than links inside .claude/hooks/."
            exit 0
          fi
          echo "Symlinks or submodules not allowed:"
          printf '  %s\n' "${violations[@]}"
          fail "Claude Code locations accept no symlinks or submodules, except links inside a .claude/hooks/ directory to a regular file in that same directory. The '$APPROVAL_LABEL' label does not override this."

      - name: Check protected paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXTRA_PATTERNS: ${{ inputs.protected-paths }}
        run: |
          set -euo pipefail
          shopt -s nocasematch

          fail() {
            echo "::error::$1"
            exit 1
          }

          patterns=(
            # Lockfiles and dependency manifests: new or updated dependencies.
            Cargo.lock package-lock.json npm-shrinkwrap.json pnpm-lock.yaml
            yarn.lock bun.lock bun.lockb .terraform.lock.hcl go.sum
            poetry.lock uv.lock Pipfile.lock Gemfile.lock composer.lock flake.lock
            Cargo.toml package.json pyproject.toml 'requirements*.txt'
            'constraints*.txt' Pipfile setup.py setup.cfg go.mod Gemfile
            composer.json flake.nix rust-toolchain rust-toolchain.toml
            .npmrc .yarnrc .yarnrc.yml .tool-versions '.cargo/*' '*/.cargo/*'
            # OpenTofu in JSON syntax (always protected; .tf is inspected below).
            '*.tf.json' '*.tofu.json'
            # CI, repository automation and secret scanning rules.
            '.github/*' .gitleaks.toml .gitleaksignore
            # Secret encryption rules.
            .sops.yaml
            # Supply chain policy: cargo-deny (licenses, bans, sources and
            # ignored advisories) and the exceptions of the advisory step.
            deny.toml advisory-exceptions.json
            # Claude Code: settings (hooks, permissions, plugins), hooks and
            # the scripts they run, plugin manifests (plugin.json accepts
            # hooks and mcpServers), MCP and LSP servers, plugin monitors,
            # settings and executables, and the rules injected into every
            # session. They run commands or grant permissions on every
            # machine that pulls the repository. A .claude or .claude/hooks
            # that is a symlink shows up as a single file. Below, every other
            # file under .claude/ or plugins/<name>/ is protected too, and
            # Markdown there is inspected (frontmatter and ```! blocks).
            '.claude/settings*.json' '*/.claude/settings*.json'
            '.claude/hooks/*' '*/.claude/hooks/*' '.claude/hooks' '*/.claude/hooks'
            .claude
            'hooks/hooks.json' '*/hooks/hooks.json'
            '.claude-plugin/*' '*/.claude-plugin/*'
            .mcp.json .lsp.json 'monitors/monitors.json' '*/monitors/monitors.json'
            'plugins/*/hooks/*' '*/plugins/*/hooks/*' 'plugins/*/bin/*' '*/plugins/*/bin/*'
            'plugins/*/settings.json' '*/plugins/*/settings.json'
            'memory/RULES.md' '*/memory/RULES.md'
            # Authentication.
            'auth/*' '*/auth/*' 'oauth/*' '*/oauth/*'
            'authentication/*' '*/authentication/*' 'login/*' '*/login/*'
            'auth.*' 'auth_*' '*_auth.*' 'oauth*'
            # Payments.
            'payment/*' '*/payment/*' 'payments/*' '*/payments/*'
            'billing/*' '*/billing/*' 'purchase/*' '*/purchase/*'
            'purchases/*' '*/purchases/*' 'payment*' '*_payment*' 'billing*'
          )
          while IFS= read -r line; do
            line="${line%%#*}"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            if [ -n "$line" ]; then patterns+=("$line"); fi
          done <<< "$EXTRA_PATTERNS"

          # Any API failure fails the gate; it never passes by default.
          work="$RUNNER_TEMP/human-gate"
          mkdir -p "$work"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$work/pr.json" \
            || fail "Could not read the pull request."
          changed_files="$(jq -r '.changed_files' "$work/pr.json")"
          # The files API lists at most 3000 files.
          if [ "$changed_files" -ge 3000 ]; then
            fail "The pull request changes $changed_files files; the gate cannot list them all. Split it."
          fi
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | @json' > "$work/files.jsonl" \
            || fail "Could not list the files of the pull request."
          listed="$(wc -l < "$work/files.jsonl")"
          if [ "$listed" -ne "$changed_files" ]; then
            fail "Listed $listed files, but the pull request changes $changed_files."
          fi

          base_sha="$(jq -r '.base.sha' "$work/pr.json")"
          head_sha="$(jq -r '.head.sha' "$work/pr.json")"
          merge_base=""

          # Line ranges ("first last ...") that a change must not touch in a
          # Markdown file. The frontmatter runs from line 1 (when the first
          # non-blank line is ---) to the first line that is exactly ---, or
          # to the end. Claude Code runs a ```! block wherever it starts in a
          # line and an inline !`command` across lines, so a file with a ```!
          # (or ~~~!) anywhere, or with a !` not closed on its line, is one
          # range from the first line to the last.
          # shellcheck disable=SC2016 # awk program, not shell
          ranges_awk='
            { sub(/\r$/, "") }
            NR == 1 { sub(/^\357\273\277/, "") }
            fm == 0 && $0 !~ /^[ \t]*$/ {
              if ($0 ~ /^---[ \t]*$/) { fm = 1; next }
              fm = -1
            }
            fm == 1 && $0 == "---" { printf "1 %d ", NR; fm = 2 }
            index($0, "```!") || index($0, "~~~!") { whole = 1 }
            {
              rest = $0
              while ((i = index(rest, "!`")) > 0) {
                rest = substr(rest, i + 2)
                if (index(rest, "`") == 0) { whole = 1; break }
                rest = substr(rest, index(rest, "`") + 1)
              }
            }
            END { if (fm == 1) printf "1 %d ", NR; if (whole) printf "1 %d ", NR }'
          # Succeeds when an added line falls inside a range of "new" or a
          # removed line inside a range of "old".
          # shellcheck disable=SC2016 # awk program, not shell
          hunks_awk='
            function inside(n, r,   a, k, i) {
              k = split(r, a, " ")
              for (i = 1; i < k; i += 2) if (n >= a[i] + 0 && n <= a[i + 1] + 0) return 1
              return 0
            }
            /^@@/ {
              match($0, /-[0-9]+/); o = substr($0, RSTART + 1, RLENGTH - 1) + 0
              match($0, /\+[0-9]+/); n = substr($0, RSTART + 1, RLENGTH - 1) + 0
              next
            }
            /^\\/ { next }
            /^-/ { if (inside(o, old)) hit = 1; o++; next }
            /^\+/ { if (inside(n, new)) hit = 1; n++; next }
            { o++; n++ }
            END { exit !hit }'
          # Prints the ranges of the file $2 at commit $1.
          ranges_at() {
            local encoded
            encoded="$(jq -rn --arg p "$2" '$p | split("/") | map(@uri) | join("/")')"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$REPO/contents/$encoded?ref=$1" > "$work/content" || return 1
            awk "$ranges_awk" "$work/content"
          }

          matches=()
          while IFS= read -r entry; do
            # A control character (a newline above all) would split the
            # paths below and hide a protected one.
            if jq -e '[.filename, (.previous_filename // empty)] | any(test("[[:cntrl:]]"))' \
              <<< "$entry" > /dev/null; then
              fail "A file name in this pull request has a control character; the gate cannot check it. Rename the file."
            fi
            file="$(jq -r '.filename' <<< "$entry")"
            # Renames also count their old path.
            mapfile -t paths < <(jq -r '.filename, (.previous_filename // empty)' <<< "$entry")
            matched=""
            for path in "${paths[@]}"; do
              for pattern in "${patterns[@]}"; do
                if [[ "$pattern" == */* ]]; then
                  subject="$path"
                else
                  subject="${path##*/}"
                fi
                # shellcheck disable=SC2053 # pattern match on purpose
                if [[ "$subject" == $pattern ]]; then
                  matched="$path (matches '$pattern')"
                  break 2
                fi
              done
            done
            # OpenTofu: provider and module versions and sources live in
            # any .tf file, so every added or removed line is inspected for
            # the keywords anywhere in it (inline blocks included). Without a
            # diff (too large or binary), the file counts as protected.
            if [ -z "$matched" ] && [[ "$file" == *.tf || "$file" == *.tofu ]]; then
              if ! jq -e 'has("patch")' <<< "$entry" > /dev/null; then
                matched="$file (OpenTofu diff unavailable)"
              else
                patch="$(jq -r '.patch' <<< "$entry")"
                if grep -qiE '^[+-](.*[^[:alnum:]_])?(required_providers|required_version)([^[:alnum:]_]|$)' <<< "$patch" \
                  || grep -qiE '^[+-](.*[^[:alnum:]_])?(source|version)[[:space:]]*=' <<< "$patch"; then
                  matched="$file (OpenTofu source or version changed)"
                fi
              fi
            fi
            # Claude Code skills, agents, commands and plugins. Every file
            # that is not Markdown under a .claude/ directory or a plugin
            # (plugins/<name>/) is protected: scripts that skills, hooks and
            # servers run live there. Markdown is inspected: the frontmatter
            # accepts hooks, mcpServers, permissionMode and allowed-tools,
            # and the body runs !`command` and ```! blocks. The file is
            # protected when an added or removed line falls inside the
            # frontmatter, or anywhere in a file that has a ```! or an
            # unclosed !` (before or after the change), or anywhere has one
            # of those keys, an inline command, a ```!,
            # a YAML hex escape, an explicit key ("? ") or an anchor or alias.
            # A rename or copy protects the file, because the diff does not
            # show the frontmatter that moved. Without a diff (too large or
            # binary), or when the frontmatter cannot be read, the file
            # counts as protected.
            if [ -z "$matched" ]; then
              for path in "${paths[@]}"; do
                if [[ "$path" != .claude/* && "$path" != */.claude/* \
                  && "$path" != plugins/*/* && "$path" != */plugins/*/* ]]; then
                  continue
                fi
                if [[ "$path" != *.md ]]; then
                  matched="$path (file of Claude Code settings, skills, agents, commands or plugins)"
                elif jq -e 'has("previous_filename")' <<< "$entry" > /dev/null; then
                  matched="$path (Claude Code instructions renamed or copied)"
                elif ! jq -e 'has("patch")' <<< "$entry" > /dev/null; then
                  matched="$path (Claude Code instructions diff unavailable)"
                else
                  patch="$(jq -r '.patch' <<< "$entry")"
                  if grep -qiE \
                    -e "^[+-](.*[^[:alnum:]_-])?[\"']?(hooks|mcpServers|permissionMode|allowed-?tools)[\"']?[[:space:]]*:" \
                    -e '^[+-](.*[[:space:]])?!`' -e '^[+-].*(```|~~~)!' \
                    -e '^[+-].*\\[xu][[:xdigit:]]{2}' -e '^[+-][[:space:]]*\?([[:space:]]|$)' \
                    -e '^[+-](.*[[:space:]])?&[[:alnum:]_.-]+([[:space:]]|$)' \
                    -e '^[+-][[:space:]]*(-[[:space:]]+)?\*[^[:space:]]+[[:space:]]+:' \
                    -e '^[+-].*:[[:space:]]+\*[^[:space:]*]+[[:space:]]*$' <<< "$patch"; then
                    matched="$path (Claude Code frontmatter key, inline command, YAML escape, anchor or alias changed)"
                  else
                    if [ -z "$merge_base" ]; then
                      merge_base="$(gh api "repos/$REPO/compare/$base_sha...$head_sha" --jq '.merge_base_commit.sha')" \
                        || fail "Could not find the merge base of the pull request."
                    fi
                    status="$(jq -r '.status' <<< "$entry")"
                    old_ranges=""
                    new_ranges=""
                    if { [ "$status" = added ] || old_ranges="$(ranges_at "$merge_base" "$path")"; } \
                      && { [ "$status" = removed ] || new_ranges="$(ranges_at "$head_sha" "$path")"; }; then
                      if awk -v old="$old_ranges" -v new="$new_ranges" "$hunks_awk" <<< "$patch"; then
                        matched="$path (Claude Code frontmatter or file with commands changed)"
                      fi
                    else
                      matched="$path (Claude Code instructions could not be read)"
                    fi
                  fi
                fi
                break
              done
            fi
            if [ -n "$matched" ]; then matches+=("$matched"); fi
          done < "$work/files.jsonl"

          if [ "${#matches[@]}" -eq 0 ]; then
            echo "No protected paths changed."
            exit 0
          fi

          echo "Protected paths changed:"
          printf '  %s\n' "${matches[@]}"

          if ! jq -e --arg label "$APPROVAL_LABEL" 'any(.labels[]; .name == $label)' "$work/pr.json" > /dev/null; then
            fail "This pull request changes protected paths and needs the '$APPROVAL_LABEL' label, applied by a human."
          fi
          # The last application of the label must come from a person (bots,
          # like the GitHub App used by agents, cannot approve) and must be
          # newer than the last push: new commits require a new approval.
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/events?per_page=100" \
            --jq '.[] | @json' > "$work/events.jsonl" \
            || fail "Could not read the events of the pull request."
          label_event="$(jq -c --arg label "$APPROVAL_LABEL" \
            'select(.event == "labeled" and .label.name == $label)' \
            "$work/events.jsonl" | tail -n 1)"
          labeler_type="$(jq -r '.actor.type // empty' <<< "${label_event:-null}")"
          labeled_at="$(jq -r '.created_at // empty' <<< "${label_event:-null}")"
          if [ "$labeler_type" != "User" ]; then
            fail "The '$APPROVAL_LABEL' label was applied by a ${labeler_type:-unknown actor}, not by a human. Remove it and let a person apply it."
          fi

          # When the head of THIS pull request last changed. Only
          # pull_request runs on this head branch, linked to this pull
          # request, count (a run is created by each push). The push time is
          # the first run of the current SHA after the last run of any other
          # SHA, so a commit that becomes the head again (for example by a
          # fast-forward) does not inherit an older approval. A force push
          # or a base change, when newer, counts as the last change too.
          # Commit dates are not used; they come from the author. Anything
          # ambiguous fails closed.
          head_sha="$(jq -r '.head.sha' "$work/pr.json")"
          head_ref="$(jq -r '.head.ref' "$work/pr.json")"
          branch_query="$(jq -rn --arg ref "$head_ref" '$ref | @uri')"
          gh api --paginate "repos/$REPO/actions/runs?event=pull_request&branch=$branch_query&per_page=100" \
            --jq '.workflow_runs[] | @json' > "$work/runs.jsonl" \
            || fail "Could not read the workflow runs of the pull request."
          jq -r --arg ref "$head_ref" --arg repo "$REPO" --argjson pr "$PR_NUMBER" \
            'select(.event == "pull_request" and .head_branch == $ref
              and .head_repository.full_name == $repo
              and any(.pull_requests[]?; .number == $pr))
             | "\(.created_at) \(.head_sha)"' \
            "$work/runs.jsonl" | sort > "$work/pr-runs.txt"
          last_other_at="$(awk -v sha="$head_sha" '$2 != sha { t = $1 } END { print t }' "$work/pr-runs.txt")"
          head_run_at="$(awk -v sha="$head_sha" -v after="$last_other_at" \
            '$2 == sha && $1 > after { print $1; exit }' "$work/pr-runs.txt")"
          if [ -z "$head_run_at" ]; then
            fail "Could not find when the head commit $head_sha was pushed to this pull request."
          fi
          other_changes_at="$(jq -r 'select(.event == "head_ref_force_pushed" or .event == "base_ref_changed") | .created_at' \
            "$work/events.jsonl" | sort | tail -n 1)"
          pushed_at="$(printf '%s\n' "$head_run_at" "$other_changes_at" | sort | tail -n 1)"

          # Timestamps are ISO 8601 in UTC, so text order is time order.
          if [[ ! "$labeled_at" > "$pushed_at" ]]; then
            fail "The '$APPROVAL_LABEL' label ($labeled_at) is older than the last change of the head or base ($pushed_at). Remove it and apply it again after reviewing the pull request."
          fi
          echo "Approved: '$APPROVAL_LABEL' applied by a human at $labeled_at, after the last change of the head or base at $pushed_at."

  rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_DIR: ${{ inputs.rust-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Cargo.toml
        id: detect
        run: |
          if [ -f "$RUST_DIR/Cargo.toml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No $RUST_DIR/Cargo.toml; nothing to check."
          fi

      # Uses rust-toolchain.toml when the repository has one; otherwise the
      # stable toolchain that comes with the runner image.
      - name: Set up the toolchain
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ inputs.rust-directory }}
        run: |
          set -euo pipefail
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup toolchain install
          fi
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.detect.outputs.present == 'true'
        with:
          workspaces: ${{ inputs.rust-directory }}

      - name: cargo fmt
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ inputs.rust-directory }}
        run: cargo fmt --all --check

      - name: cargo clippy
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ inputs.rust-directory }}
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ inputs.rust-directory }}
        run: cargo test --locked

  # Supply chain of Rust repositories (orrery#49-D2): cargo-deny with the
  # deny.toml of the repository, plus the GHSA advisories that quinn-rs/quinn
  # publishes in its own repository (most of them never reach RustSec, so
  # cargo-deny does not see them). Both live in this one job so that a single
  # required check, `ci / deny`, covers every advisory source; the quinn step
  # runs even when cargo-deny fails, so one run reports both.
  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUST_DIR: ${{ inputs.rust-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Cargo.toml and deny.toml
        id: detect
        run: |
          if [ ! -f "$RUST_DIR/Cargo.toml" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No $RUST_DIR/Cargo.toml; nothing to check."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          if [ -f "$RUST_DIR/deny.toml" ]; then
            echo "config=true" >> "$GITHUB_OUTPUT"
          else
            echo "config=false" >> "$GITHUB_OUTPUT"
          fi

      # The advisory script comes from this repository, like the OpenSpec
      # lockfile: main for callers, the pull request head here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: tools
        if: steps.detect.outputs.present == 'true'
        with:
          repository: Cogwyrm-Studios/.github
          ref: ${{ github.repository == 'Cogwyrm-Studios/.github' && github.event.pull_request.head.sha || 'main' }}
          path: .cogwyrm-ci
          sparse-checkout: tools/repo-advisories
          persist-credentials: false

      - name: Require deny.toml
        if: steps.detect.outputs.present == 'true' && steps.detect.outputs.config != 'true'
        run: |
          echo "::error::$RUST_DIR/Cargo.toml exists but $RUST_DIR/deny.toml does not. Every Rust repository needs a cargo-deny policy (orrery#49-D2)."
          exit 1

      - name: Install cargo-deny
        if: steps.detect.outputs.present == 'true'
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" --strip-components=1 "$name/cargo-deny"
          "$RUNNER_TEMP/cargo-deny" --version

      # cargo-deny reads the crate graph through `cargo metadata`, so it needs
      # the toolchain of the repository when there is a rust-toolchain.toml.
      - name: Set up the toolchain
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ inputs.rust-directory }}
        run: |
          set -euo pipefail
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then
            rustup toolchain install
          fi
          cargo --version

      # Every check blocks on an error. What counts as an error (yanked,
      # unmaintained, duplicate versions...) is set in deny.toml, which is a
      # protected path of the human gate.
      - name: cargo deny check
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ inputs.rust-directory }}
        run: '"$RUNNER_TEMP/cargo-deny" --locked --config deny.toml check advisories licenses bans sources'

      # Fails when a locked quinn, quinn-proto or quinn-udp is affected by a
      # published advisory, or when the answer cannot be trusted (see
      # README.md). Without those crates in Cargo.lock the API is not called.
      # MIN_ADVISORIES is the number published on 2026-10-04: advisories are
      # withdrawn, never deleted, so fewer means a broken answer. Raise it
      # when quinn publishes more.
      - name: quinn security advisories
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_ADVISORIES: "13"
        run: |
          .cogwyrm-ci/tools/repo-advisories/check.sh \
            --lock "$RUST_DIR/Cargo.lock" \
            --repo quinn-rs/quinn \
            --min-advisories "$MIN_ADVISORIES" \
            --exceptions "$RUST_DIR/advisory-exceptions.json" \
            quinn quinn-proto quinn-udp
